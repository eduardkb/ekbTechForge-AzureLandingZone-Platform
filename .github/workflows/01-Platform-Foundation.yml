name: 01-Platform Foundation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-platform-foundation
  cancel-in-progress: false

jobs:
  foundation:
    runs-on: ubuntu-latest
    environment: azure-platform
    defaults:
        run:
            working-directory: 01-platform-foundation

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_platform_subscription_id: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}
      TF_VAR_billing_scope_id: ${{ vars.BILLING_SCOPE_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_enable_telemetry: ${{ vars.ENABLE_TELEMETRY || 'false' }}
      TF_VAR_platform_subscriptions: ${{ vars.PLATFORM_SUBSCRIPTIONS_JSON }}
      TF_VAR_allowed_locations: ${{ vars.ALLOWED_LOCATIONS_JSON }}
      TF_VAR_required_tags: ${{ vars.REQUIRED_TAGS_JSON }}
      TF_VAR_allowed_resource_types: ${{ vars.ALLOWED_RESOURCE_TYPES_JSON }}
      TF_VAR_security_groups: ${{ vars.SECURITY_GROUPS_JSON }}
      TF_VAR_group_role_assignments: ${{ vars.GROUP_ROLE_ASSIGNMENTS_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10.0, < 2.0.0"

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}

      - name: Validate Terraform inputs
        shell: bash
        run: |
          required_vars=(
            TF_VAR_platform_subscription_id
            TF_VAR_billing_scope_id
            TF_VAR_location
            TF_VAR_platform_subscriptions
            TF_VAR_allowed_locations
            TF_VAR_required_tags
            TF_VAR_allowed_resource_types
            TF_VAR_security_groups
            TF_VAR_group_role_assignments
          )
          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions variable for $name"
              exit 1
            fi
          done
          jq -e 'keys == ["connectivity", "management"] and (.management.subscription_name | type == "string") and (.connectivity.subscription_name | type == "string")' <<< "$TF_VAR_platform_subscriptions" >/dev/null
          jq -e 'type == "array" and length > 0' <<< "$TF_VAR_allowed_locations" >/dev/null
          jq -e 'type == "array" and length > 0' <<< "$TF_VAR_required_tags" >/dev/null
          jq -e 'type == "array" and length > 0' <<< "$TF_VAR_allowed_resource_types" >/dev/null
          jq -e 'type == "object" and length > 0' <<< "$TF_VAR_security_groups" >/dev/null
          jq -e 'type == "object" and length > 0' <<< "$TF_VAR_group_role_assignments" >/dev/null

      - name: Initialize Terraform
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
        run: |
            terraform init \
                -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
                -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
                -backend-config="container_name=$TFSTATE_CONTAINER" \
                -backend-config="key=platform-foundation.tfstate" \
                -backend-config="use_azuread_auth=true" \
                -backend-config="use_oidc=true"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -out=tfplan

      - name: Apply Terraform plan
        run: terraform apply -auto-approve tfplan