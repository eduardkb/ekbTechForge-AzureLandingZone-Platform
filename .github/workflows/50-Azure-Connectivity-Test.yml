#######################################
# TEST AZURE CONNECTIVITY WITH OIDC
#######################################

name: 50-Azure Connectivity Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure:
    runs-on: ubuntu-latest
    environment: azure-platform

    steps:
      - name: Print GitHub Variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          PLATFORM_SUBSCRIPTION_ID: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
          BILLING_SCOPE_ID: ${{ vars.BILLING_SCOPE_ID }}
        run: |
          echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
          echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
          echo "PLATFORM_SUBSCRIPTION_ID=$PLATFORM_SUBSCRIPTION_ID"
          echo "TFSTATE_RESOURCE_GROUP=$TFSTATE_RESOURCE_GROUP"
          echo "TFSTATE_STORAGE_ACCOUNT=$TFSTATE_STORAGE_ACCOUNT"
          echo "TFSTATE_CONTAINER=$TFSTATE_CONTAINER"
          echo "BILLING_SCOPE_ID=$BILLING_SCOPE_ID"

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}

      - name: Verify Azure Authentication
        run: az account show --output table

      - name: Test Resource Group Access
        run: az group list --output table