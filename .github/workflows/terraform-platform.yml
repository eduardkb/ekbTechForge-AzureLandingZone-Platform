name: Terraform platform root

on:
  workflow_dispatch:
    inputs:
      component:
        description: Independent Terraform root to deploy
        required: true
        type: choice
        options:
          - platform-management
          - platform-connectivity
          - platform-security-identity
      apply:
        description: Apply the reviewed plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.component }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: azure-platform
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Select backend key
        id: state
        shell: bash
        run: echo "key=${{ inputs.component }}.tfstate" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ inputs.component }}
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=${{ steps.state.outputs.key }}"
          -backend-config="use_azuread_auth=true"

      - name: Terraform validate
        working-directory: ${{ inputs.component }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ inputs.component }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.apply }}
        working-directory: ${{ inputs.component }}
        run: terraform apply -input=false -auto-approve tfplan