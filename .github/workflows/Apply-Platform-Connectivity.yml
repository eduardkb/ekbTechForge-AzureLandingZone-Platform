name: Apply-Platform Connectivity

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-platform-connectivity
  cancel-in-progress: false

jobs:
  connectivity:
    runs-on: ubuntu-latest
    environment: azure-platform
    defaults:
      run:
        working-directory: 03-platform-connectivity

    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10.0, < 2.0.0"

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.PLATFORM_SUBSCRIPTION_ID }}

      - name: Check connectivity subscription exists
        id: connectivity_subscription
        shell: bash
        run: |
          subscription_id="$(az account list --all \
            --query "[?name=='platform-connectivity-sub'].id | [0]" \
            --output tsv)"

          if [ -z "$subscription_id" ] || [ "$subscription_id" = "None" ]; then
            echo "::error::The platform connectivity subscription was not found. Run the Apply-Platform-Foundation workflow first."
            exit 1
          fi

          echo "subscription_id=$subscription_id" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform
        env:
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=platform-connectivity.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      # - name: Check formatting
      #   run: terraform fmt -check -recursive

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        env:
          CONNECTIVITY_SUBSCRIPTION_ID: ${{ steps.connectivity_subscription.outputs.subscription_id }}
        run: |
          terraform plan \
            -out=connectivity-apply.tfplan \
            -var="connectivity_subscription_id=$CONNECTIVITY_SUBSCRIPTION_ID"

      - name: Apply Terraform plan
        run: terraform apply -auto-approve connectivity-apply.tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f connectivity-apply.tfplan